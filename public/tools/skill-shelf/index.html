<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Reusable AI skill packages by Rintaro Masaoka. Browse the shelf and download the collection."
    />
    <title>Skill Shelf — Rintaro Masaoka</title>
    <link rel="stylesheet" href="./styles.css" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23121f33'/%3E%3Cpath d='M8 8h4v16H8zm6-2h4v18h-4zm6 5h4v13h-4z' fill='%23f4f7fb'/%3E%3Cpath d='M6 24h20v2H6z' fill='%23ff5a3d'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="Skill Shelf home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>Skill Shelf</span>
      </a>
      <p class="publisher">A collection by <strong>Rintaro Masaoka</strong></p>
    </header>

    <main id="top">
      <section class="shelf" aria-labelledby="shelf-title">
        <div class="section-heading">
          <h2 id="shelf-title">Packages</h2>
          <span>7 packages</span>
        </div>

        <div class="shelf-case">
          <div class="books" aria-label="Available packages">
            <button class="book book--paper package-open" data-package="physics-paper" aria-label="Open Physics Paper package">
              <span class="book-title">Physics Paper</span>
              <span class="book-meta">v0.1.5</span>
            </button>

            <button class="book book--academic package-open" data-package="academic-writing" aria-label="Open Academic Writing package">
              <span class="book-title">Academic Writing</span>
              <span class="book-meta">v0.2.3</span>
            </button>

            <button class="book book--nogap package-open" data-package="nogap" aria-label="Open Nogap package">
              <span class="book-title">Nogap</span>
              <span class="book-meta">v0.1.0</span>
            </button>

            <button class="book book--manim package-open" data-package="manim" aria-label="Open Manim package">
              <span class="book-title">Manim</span>
              <span class="book-meta">v0.1.0+</span>
            </button>

            <button class="book book--research package-open" data-package="research-workflow" aria-label="Open Research Workflow package">
              <span class="book-title">Research Workflow</span>
              <span class="book-meta">v0.1.2</span>
            </button>

            <button class="book book--study package-open" data-package="study-notes" aria-label="Open Study Notes package">
              <span class="book-title">Study Notes</span>
              <span class="book-meta">v0.1.1</span>
            </button>

            <button class="book book--bias package-open" data-package="ai-bias" aria-label="Open AI Bias package">
              <span class="book-title">AI Bias</span>
              <span class="book-meta">v0.3.0</span>
            </button>

          </div>
          <div class="shelf-board"><span>SKILL SHELF · 001—007</span></div>
        </div>
      </section>

    </main>

    <footer>
      <span>Skill Shelf</span>
      <span>Rintaro Masaoka</span>
    </footer>

    <dialog class="package-dialog" id="package-dialog" aria-labelledby="dialog-title">
      <button class="dialog-close" aria-label="Close package details">×</button>
      <div class="open-book">
        <aside class="book-page contents-page">
          <div class="dialog-header">
            <p class="book-eyebrow">SKILL SHELF</p>
            <h2 id="dialog-title"></h2>
            <p id="dialog-description"></p>
          </div>
          <nav class="dialog-section" aria-label="Table of contents">
            <h3>Contents</h3>
            <ol class="skill-list" id="dialog-skills"></ol>
          </nav>
          <div class="dialog-section package-facts">
            <span id="package-version"></span>
            <span id="license-label"></span>
          </div>
          <div class="dialog-section">
            <a class="download-button" href="./downloads/skill-shelf.zip" download>Download collection ↓</a>
          </div>
        </aside>
        <section class="book-page reading-page" aria-label="Skill chapter">
          <header class="running-header"><button id="back-to-skill" hidden>← Back to skill</button><span id="chapter-label">Select a chapter</span><a id="chapter-source" target="_blank" rel="noopener">Source ↗</a></header>
          <article id="chapter-body" class="chapter-body" tabindex="0" aria-live="polite"></article>
          <nav class="page-turns" aria-label="Chapter navigation">
            <button id="previous-chapter">← Previous</button>
            <span id="page-number"></span>
            <button id="next-chapter">Next →</button>
          </nav>
        </section>
      </div>
    </dialog>

    <script src="./app.js"></script>
  </body>
</html>
