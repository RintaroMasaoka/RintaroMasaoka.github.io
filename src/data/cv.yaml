# CV PDF 用の研究概要
research_interests:
  en: |
    I am interested in exploring universal properties of quantum phases of matter and quantum phase transitions. My current research focuses on frustration-free quantum systems, which exhibit distinctive properties in both gapped and gapless phases. My main research directions are:

    - Proving a universal inequality on dynamical exponents for frustration-free quantum critical points.
    - Formulating and characterizing frustration-free free-fermion systems.
  ja: |
    量子物質の相と量子相転移の普遍的性質の解明に興味があります。現在の研究では、ギャップのある相とギャップレスの相の双方で特徴的な性質を示すフラストレーションフリー量子系に焦点を当てています。主な研究の方向性は以下の通りです。

    - フラストレーションフリー量子臨界点における動的指数の普遍的不等式の証明。
    - フラストレーションフリー自由フェルミオン系の定式化と特徴づけ。

