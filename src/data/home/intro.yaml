    en: 政岡 凜太郎
    ja: Rintaro Masaoka

# 短い自己紹介
bio:
  en: |
    Rintaro Masaoka (政岡凜太郎) is a graduate student specializing in condensed matter theory and statistical physics.
    He is interested in quantum phase transitions, particularly quantum critical phenomena characterized by non-trivial dynamic critical exponents.
  ja: |
    物性理論・統計物理学を専攻する博士課程の学生(現在はResearch Assistant)です。
    量子相転移、特に非自明な動的臨界指数で特徴づけられる量子臨界現象に興味があります。

# 研究分野
research_interests:
  - title:
      en: Non-relativistic Critical Phenomena
      ja: 非相対論的臨界現象
    description:
      en: At a quantum critical point, space and time need not scale in the same way. I am interested in quantum critical phenomena with anisotropic space-time scaling, including Lifshitz critical points. In particular, I study how the dynamical critical exponent is constrained and how it is reflected in low-energy excitations and correlations.
      ja: 量子臨界点では、空間と時間が同じようにスケールするとは限りません。私は、Lifshitz臨界点をはじめ、空間と時間が異なる尺度で変換される量子臨界現象に関心があります。特に、動的臨界指数がどのような条件で制約され、それが低エネルギー励起や相関にどう現れるかを研究しています。

