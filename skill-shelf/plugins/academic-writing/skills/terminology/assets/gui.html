<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Term Review</title>
<style>
:root{font-family:ui-sans-serif,system-ui,sans-serif;color:#20231f;background:#f4f2ec;--line:#d8d4ca;--paper:#fffefb;--muted:#72756e;--ink:#20231f;--soft:#efede6;--accent:#42543e;--ai:#e9eef5;--danger:#8a392f}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}button,input{font:inherit}.app{height:100vh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;background:var(--paper)}header{display:flex;align-items:center;gap:14px;height:50px;padding:0 14px;border-bottom:1px solid var(--line)}header strong{font-size:15px;white-space:nowrap}.progress{font-size:12px;color:var(--muted);white-space:nowrap}.progress b{color:var(--ink)}.search{margin-left:auto;width:min(220px,32vw);border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:white}.filters{display:flex;align-items:center;gap:5px;padding:7px 10px;border-bottom:1px solid var(--line);overflow-x:auto}.filter{white-space:nowrap;border:1px solid transparent;background:transparent;border-radius:999px;padding:5px 9px;color:var(--muted);cursor:pointer;font-size:12px}.filter:hover{background:var(--soft)}.filter.active{background:var(--ink);color:white}.filter b{font-size:11px;margin-left:3px}.table{min-height:0;overflow:auto;scroll-behavior:smooth}.head,.row{display:grid;grid-template-columns:minmax(135px,1.2fr) minmax(120px,1.8fr) auto;gap:10px;align-items:center}.head{position:sticky;top:0;z-index:2;padding:6px 12px;background:#f5f3ed;border-bottom:1px solid var(--line);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}.row{min-height:48px;padding:6px 12px;border-bottom:1px solid #e6e2d9}.row:hover{background:#faf9f5}.row.active{background:#f0f2ec;box-shadow:inset 3px 0 var(--accent)}.term{display:flex;align-items:center;gap:6px;min-width:0}.term strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:650 15px Georgia,serif}.state{display:inline-block;width:7px;height:7px;border-radius:50%;background:#8190a7;flex:none}.state.human{background:#4d7753}.context{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px}.policies{display:grid;grid-template-columns:repeat(4,28px);gap:3px}.policy{height:27px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--muted);cursor:pointer;font-weight:700;font-size:11px;padding:0}.policy:hover{border-color:var(--accent);color:var(--ink)}.policy.current.ai{background:var(--ai);border-color:#9ba9bc;color:#33465f}.policy.current.human{background:var(--accent);border-color:var(--accent);color:white}.policy[data-policy="forbidden"]{color:var(--danger)}.policy.current[data-policy="forbidden"]{background:var(--danger);border-color:var(--danger);color:white}.empty{padding:18vh 20px;text-align:center;color:var(--muted)}footer{min-height:64px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:6px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:10px}.legend{display:grid;grid-template-columns:repeat(4,minmax(90px,1fr));gap:8px}.meaning{display:grid;grid-template-columns:auto 1fr;column-gap:5px;align-items:start;line-height:1.25}.meaning b{display:block;color:var(--ink);font-size:10px}.meaning small{display:block;font-size:9px}.key{display:inline-block;min-width:17px;padding:1px 4px;border:1px solid var(--line);border-radius:4px;background:white;text-align:center;color:var(--ink)}.nav-keys{text-align:right;line-height:1.65;white-space:nowrap}.toast{position:absolute;right:12px;bottom:72px;background:var(--ink);color:white;padding:6px 9px;border-radius:6px;font-size:11px;opacity:0;pointer-events:none;transition:opacity .12s}.toast.show{opacity:1}@media(max-width:680px){header{gap:8px}.head,.row{grid-template-columns:minmax(105px,.9fr) auto}.head .context-head,.context{display:none}.search{width:120px}footer{grid-template-columns:1fr}.nav-keys{text-align:left}.state-legend{display:none}}@media(max-width:480px){.legend{grid-template-columns:1fr 1fr}}@media(max-height:560px){header{height:42px}.filters{padding:4px 8px}.row{min-height:41px;padding-top:4px;padding-bottom:4px}footer{min-height:44px;padding-top:3px;padding-bottom:3px}.meaning small,.nav-keys{display:none}}
</style>
</head>
<body>
<div class="app">
  <header><strong>Term review</strong><span class="progress" id="progress"></span><input class="search" id="search" type="search" placeholder="Search" aria-label="Search terms"></header>
  <nav class="filters" id="filters" aria-label="Term lists"></nav>
  <main class="table" id="table" tabindex="0" aria-label="Terminology review list"></main>
  <footer><div class="legend"><span class="meaning"><span class="key">1</span><span><b>Use directly</b><small>Reader already knows it</small></span></span><span class="meaning"><span class="key">2</span><span><b>Explain once</b><small>A phrase or sentence is enough</small></span></span><span class="meaning"><span class="key">3</span><span><b>Define explicitly</b><small>The exact meaning must be fixed</small></span></span><span class="meaning"><span class="key">4</span><span><b>Remove term</b><small>It must not appear</small></span></span></div><div class="nav-keys">↑↓ / J K Move · Enter Accept<br>Space Defer</div></footer>
  <div class="toast" id="toast">Saved</div>
</div>
<script>
const csrf=__CSRF__;
const policies=[['as_is','Use directly — reader already knows it','1'],['brief_intro','Explain once — a phrase or sentence is enough','2'],['full_definition','Define explicitly — the exact meaning must be fixed','3'],['forbidden','Remove term — it must not appear','4']];
const views=[['all','All'],['pending','Pending'],['as_is','Direct'],['brief_intro','Explain'],['full_definition','Define'],['forbidden','Remove'],['deferred','Deferred']];
let terms=[],view='all',activeKey=null;
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function inView(term,id=view){if(id==='all')return true;if(id==='pending')return term.authorization!=='human_authorized'&&!term.deferred;if(id==='deferred')return !!term.deferred;return term.usage_policy===id}
function visibleTerms(){const q=document.getElementById('search').value.trim().toLowerCase();return terms.filter(t=>inView(t)&&(!q||t.display.toLowerCase().includes(q)||(t.first_occurrence?.context||'').toLowerCase().includes(q)))}
function setActive(key,focus=false){activeKey=key;renderRows();if(focus){document.querySelector(`[data-key="${CSS.escape(key)}"]`)?.scrollIntoView({block:'nearest'});document.getElementById('table').focus()}}
async function load(){const response=await fetch('/api/terms');terms=await response.json();activeKey=visibleTerms()[0]?.term_key||null;render()}
function render(){renderProgress();renderFilters();renderRows()}
function renderProgress(){const human=terms.filter(t=>t.authorization==='human_authorized').length;document.getElementById('progress').innerHTML=`<b>${human}</b> of ${terms.length} reviewed`}
function renderFilters(){document.getElementById('filters').innerHTML=views.map(([id,label])=>`<button class="filter ${id===view?'active':''}" data-view="${id}">${label}<b>${terms.filter(t=>inView(t,id)).length}</b></button>`).join('')}
function renderRows(){const rows=visibleTerms(),table=document.getElementById('table');if(!rows.some(t=>t.term_key===activeKey))activeKey=rows[0]?.term_key||null;if(!rows.length){table.innerHTML='<div class="empty">No terms in this list</div>';return}table.innerHTML='<div class="head"><span>Term</span><span class="context-head">First occurrence</span><span>Class</span></div>'+rows.map(t=>{const occurrence=t.first_occurrence||{},auth=t.authorization==='human_authorized'?'human':'ai';return `<div class="row ${t.term_key===activeKey?'active':''}" data-key="${esc(t.term_key)}"><div class="term"><span class="state ${auth}"></span><strong title="${esc(t.display)}">${esc(t.display)}</strong></div><div class="context" title="${esc(occurrence.context||'')}">${esc(occurrence.context||'No occurrence')}</div><div class="policies" aria-label="Classification for ${esc(t.display)}">${policies.map(([id,label,key])=>`<button class="policy ${t.usage_policy===id?'current '+auth:''}" data-policy="${id}" title="${key}: ${label}" aria-label="${label}">${key}</button>`).join('')}</div></div>`}).join('')}
async function post(payload){const response=await fetch('/api/decide',{method:'POST',headers:{'Content-Type':'application/json','X-Term-CSRF':csrf},body:JSON.stringify(payload)});if(!response.ok)throw new Error((await response.json()).error);return response.json()}
async function decide(term,policy){if(!term)return;const updated=await post({term:term.display,usage_policy:policy});terms=terms.map(t=>t.term_key===updated.term_key?{...t,...updated}:t);advanceFrom(updated.term_key);flash();render()}
async function defer(term){if(!term)return;const updated=await post({term:term.display,action:'defer'});terms=terms.map(t=>t.term_key===updated.term_key?{...t,...updated}:t);advanceFrom(updated.term_key);render()}
function advanceFrom(key){const rows=visibleTerms(),index=rows.findIndex(t=>t.term_key===key);activeKey=(rows[index+1]||rows[index-1]||{}).term_key||null}
function active(){return terms.find(t=>t.term_key===activeKey)}
function move(delta){const rows=visibleTerms();if(!rows.length)return;let index=rows.findIndex(t=>t.term_key===activeKey);index=Math.max(0,Math.min(rows.length-1,(index<0?0:index+delta)));setActive(rows[index].term_key,true)}
function flash(){const toast=document.getElementById('toast');toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),300)}
document.addEventListener('click',event=>{const filter=event.target.closest('[data-view]');if(filter){view=filter.dataset.view;activeKey=null;render();return}const row=event.target.closest('[data-key]');if(row)activeKey=row.dataset.key;const policy=event.target.closest('[data-policy]');if(policy)decide(active(),policy.dataset.policy);else if(row)renderRows()});
document.addEventListener('keydown',event=>{if(event.target.matches('input'))return;const key=event.key.toLowerCase();if(['arrowdown','arrowup','j','k'].includes(key)){event.preventDefault();move(key==='arrowdown'||key==='j'?1:-1)}else if(event.key==='Enter'){event.preventDefault();const term=active();if(term&&term.usage_policy!=='undecided')decide(term,term.usage_policy)}else if(['1','2','3','4'].includes(event.key)){event.preventDefault();decide(active(),policies[Number(event.key)-1][0])}else if(event.code==='Space'){event.preventDefault();defer(active())}});
document.getElementById('search').addEventListener('input',()=>{activeKey=null;renderRows()});
load();
</script>
</body>
</html>
